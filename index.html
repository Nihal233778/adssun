<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Tapper · TeleAds</title>
    
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- ========================================== -->
    <!-- TELEADS SDK (REWARDED & INTERSTITIAL)      -->
    <!-- ========================================== -->
    <script src="https://assets.teleads.pro/sdk/index.umd.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #17212b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: absolute;
            top: 20px;
            display: flex;
            justify-content: space-between;
            width: 80%;
            font-size: 24px;
            font-weight: bold;
        }

        .game-area {
            position: relative;
            width: 90vw;
            height: 50vh;
            background-color: #232e3c;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .target {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #2ea6ff, #0078d7);
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #2ea6ff;
            transition: transform 0.1s ease;
        }

        .target:active {
            transform: scale(0.9);
        }

        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #2ea6ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 166, 255, 0.4);
        }

        .btn:active {
            background-color: #1c8ce6;
        }

        .hidden {
            display: none;
        }

        /* --- AD BANNER STYLES --- */
        .ad-wrapper {
            position: absolute;
            bottom: 15px;
            width: 90%;
            min-height: 80px;
            background-color: #232e3c;
            border: 1px dashed #4a5d70;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b9eb0;
            font-size: 14px;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Small status indicator for ad state */
        .ad-status {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
            color: #4a5d70;
        }
    </style>
</head>
<body>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#17212b');
        tg.setBackgroundColor('#17212b');
    </script>

    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">10</span>s</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="target hidden" id="target"></div>
    </div>

    <button class="btn" id="startBtn">Start Game</button>

    <!-- ========================================== -->
    <!-- AD CONTAINER (visual placeholder)          -->
    <!-- ========================================== -->
    <div class="ad-wrapper" id="adsun-ad-container">
        <span style="color: #8b9eb0;">Ad Space (TeleAds ready)</span>
        <span class="ad-status" id="adStatus">⚡</span>
    </div>

    <script>
        /* ==========================================
           GAME LOGIC
           ========================================== */
        const target = document.getElementById('target');
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const adStatusEl = document.getElementById('adStatus');

        let score = 0;
        let timeLeft = 10;
        let gameInterval;
        let isPlaying = false;

        // ----- TeleAds SDK variables -----
        // ⚠️ REPLACE WITH YOUR ACTUAL TOKENS / AD UNIT IDs
        const SDK_TOKEN = '58e2ce620254e49ae915607cc51454d6cd4aa598'           // <-- paste your TeleAds SDK token
        const REWARDED_AD_UNIT_ID = '1311';   // <-- paste rewarded ad unit ID
        const INTERSTITIAL_AD_UNIT_ID = '1310';/ <-- paste interstitial ad unit ID

        // Helper to update ad status text
        function setAdStatus(text) {
            if (adStatusEl) adStatusEl.textContent = text;
        }

        // ----- Initialize TeleAds SDK -----
        (function initTeleAds() {
            if (typeof TeleAdsTMA === 'undefined') {
                console.warn('TeleAds SDK not loaded (check script URL)');
                setAdStatus('SDK missing');
                return;
            }

            try {
                TeleAdsTMA.init({
                    token: SDK_TOKEN,
                    debug: true,
                    onInitiated: () => {
                        console.log('✅ TeleAds SDK initiated!');
                        setAdStatus('Ready');
                    },
                    onError: (error) => {
                        console.error('TeleAds SDK error:', error);
                        setAdStatus('Init error');
                    }
                });
            } catch (e) {
                console.error('TeleAds init failed:', e);
                setAdStatus('Init fail');
            }
        })();

        // ----- Show interstitial ad (e.g., on game start) -----
        function showInterstitialAd() {
            if (typeof TeleAdsTMA === 'undefined' || !TeleAdsTMA.showAd) {
                console.warn('TeleAds not ready for interstitial');
                return;
            }
            setAdStatus('Interstitial...');
            TeleAdsTMA.showAd({
                adUnitId: INTERSTITIAL_AD_UNIT_ID,
                onAdLoaded: () => console.log('Interstitial ad loaded'),
                onTimeUpdated: ({ percent, currentTime }) => {
                    // Optional: log time
                },
                onClick: () => console.log('Interstitial ad clicked'),
            })
            .then(() => {
                console.log('Interstitial completed');
                setAdStatus('Ready');
            })
            .catch((err) => {
                console.warn('Interstitial failed:', err);
                setAdStatus('Ad error');
            });
        }

        // ----- Show rewarded ad (e.g., after game ends, optional double reward) -----
        function showRewardedAd() {
            if (typeof TeleAdsTMA === 'undefined' || !TeleAdsTMA.showAd) {
                console.warn('TeleAds not ready for rewarded');
                return;
            }
            setAdStatus('Rewarded...');
            TeleAdsTMA.showAd({
                adUnitId: REWARDED_AD_UNIT_ID,
                onAdLoaded: () => console.log('Rewarded ad loaded'),
                onTimeUpdated: ({ percent, currentTime }) => {
                    // Optional: update UI
                },
                onClick: () => console.log('Rewarded ad clicked'),
            })
            .then(() => {
                console.log('Rewarded completed — user should be rewarded!');
                setAdStatus('Reward granted');
                // Here you can grant an extra reward (e.g., +5 score or bonus time)
                // For demo, we just show a small notification
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                // Optional: Add a tiny bonus to score (demo)
                // score += 2; scoreEl.innerText = score;
            })
            .catch((err) => {
                console.warn('Rewarded failed:', err);
                setAdStatus('Ad error');
            });
        }

        // ----- Abort any ad (not strictly needed here but exposed) -----
        function abortAd() {
            if (typeof TeleAdsTMA !== 'undefined' && TeleAdsTMA.abort) {
                TeleAdsTMA.abort();
                setAdStatus('Aborted');
            }
        }

        // ----- GAME FUNCTIONS -----
        function moveTarget() {
            const areaRect = gameArea.getBoundingClientRect();
            const targetSize = 80; 
            const maxX = areaRect.width - targetSize;
            const maxY = areaRect.height - targetSize;
            target.style.left = `${Math.floor(Math.random() * maxX)}px`;
            target.style.top = `${Math.floor(Math.random() * maxY)}px`;
        }

        function handleTargetClick() {
            if (!isPlaying) return;
            score++;
            scoreEl.innerText = score;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            moveTarget();
        }

        function startGame() {
            // Show interstitial ad when starting a new game (optional)
            showInterstitialAd();

            score = 0;
            timeLeft = 10;
            isPlaying = true;
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            
            startBtn.style.display = 'none';
            target.classList.remove('hidden');
            moveTarget();

            // Clear any previous interval
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            target.classList.add('hidden');
            startBtn.innerText = `Play Again (Score: ${score})`;
            startBtn.style.display = 'block';
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');

            // Show rewarded ad after game ends (optional) — reward for playing
            // You could conditionally offer it if score > X, but here we always show it
            // so the user can get an extra reward.
            showRewardedAd();
        }

        target.addEventListener('pointerdown', handleTargetClick);
        startBtn.addEventListener('click', startGame);

        // Optional: expose abort function globally for debugging
        window.abortTeleAds = abortAd;

        // Log that ad integration is ready
        console.log('TeleAds integration loaded (rewarded + interstitial)');
    </script>
</body>
</html>
