<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Tapper</title>
    
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- TeleAds SDK -->
    <script src="https://assets.teleads.pro/sdk/index.umd.js"></script>

    <style>
        body {
            margin: 0; padding: 0; background-color: #17212b; color: white;
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        .header { position: absolute; top: 20px; display: flex; justify-content: space-between; width: 80%; font-size: 24px; font-weight: bold; }
        .game-area { position: relative; width: 90vw; height: 50vh; background-color: #232e3c; border-radius: 20px; }
        .target { width: 80px; height: 80px; background: radial-gradient(circle, #2ea6ff, #0078d7); border-radius: 50%; position: absolute; display: none; box-shadow: 0 0 20px #2ea6ff; }
        .btn { margin-top: 20px; padding: 15px 40px; font-size: 18px; font-weight: bold; color: white; background-color: #2ea6ff; border: none; border-radius: 12px; cursor: pointer; }
        .ad-wrapper {
            position: absolute; bottom: 15px; width: 90%; min-height: 100px;
            background-color: #232e3c; border: 1px dashed #4a5d70; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8b9eb0; font-size: 14px; text-align: center; padding: 10px; box-sizing: border-box;
        }
        .test-btn { margin-top: 10px; padding: 5px 15px; font-size: 12px; background: #ff4757; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
    </script>

    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">10</span>s</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="target" id="target"></div>
    </div>

    <button class="btn" id="startBtn">Start Game</button>

    <div class="ad-wrapper" id="adsun-ad-container">
        <span id="adText" style="color: #8b9eb0;">Ad Space (Waiting...)</span>
        <button class="test-btn" onclick="showRewardedAd()">Force Show Ad</button>
    </div>

    <script>
        // Wait until the HTML is fully loaded before running any code
        document.addEventListener('DOMContentLoaded', () => {
            /* ==========================================
               DEBUGGING LOGIC
               ========================================== */
            const adTextEl = document.getElementById('adText');

            // REPLACE THIS WITH YOUR FULL SDK TOKEN (no dots)
            const SDK_TOKEN = 'PASTE_YOUR_FULL_TOKEN_HERE'; 
            const AD_UNIT_ID_1 = '1310';

            // 1. Check if SDK loaded
            if (typeof TeleAdsTMA === 'undefined') {
                adTextEl.innerHTML = "<span style='color:red'>Error: SDK script didn't load!</span>";
            } else {
                adTextEl.innerHTML = "SDK Loaded. Initializing...";
                try {
                    TeleAdsTMA.init({
                        token: SDK_TOKEN,
                        debug: true,
                        onInitiated: () => {
                            adTextEl.innerHTML = "<span style='color:green'>SDK Init Success! Ready.</span>";
                        },
                        onError: (error) => {
                            adTextEl.innerHTML = "<span style='color:red'>Init Error: " + (error.message || error) + "</span>";
                        }
                    });
                } catch (err) {
                    adTextEl.innerHTML = "<span style='color:red'>Crash on Init: " + err.message + "</span>";
                }
            }

            window.showRewardedAd = function() {
                if (typeof TeleAdsTMA === 'undefined') return;
                adTextEl.innerText = "Requesting ad from server...";
                try {
                    TeleAdsTMA.showAd({
                        adUnitId: AD_UNIT_ID_1,
                        onAdLoaded: () => {
                            adTextEl.innerText = "AD IS PLAYING NOW!";
                        }
                    })
                    .then(() => {
                        adTextEl.innerText = "Ad Completed Successfully!";
                    })
                    .catch((err) => {
                        adTextEl.innerHTML = "<span style='color:red'>Ad Failed: " + (err.message || JSON.stringify(err)) + "</span>";
                    });
                } catch (err) {
                    adTextEl.innerHTML = "<span style='color:red'>Crash on ShowAd: " + err.message + "</span>";
                }
            };

            /* ==========================================
               GAME LOGIC
               ========================================== */
            const target = document.getElementById('target');
            const gameArea = document.getElementById('gameArea');
            const scoreEl = document.getElementById('score');
            const timeEl = document.getElementById('time');
            const startBtn = document.getElementById('startBtn');

            let score = 0;
            let timeLeft = 10;
            let gameInterval;

            function moveTarget() {
                const maxX = gameArea.getBoundingClientRect().width - 80;
                const maxY = gameArea.getBoundingClientRect().height - 80;
                target.style.left = `${Math.floor(Math.random() * maxX)}px`;
                target.style.top = `${Math.floor(Math.random() * maxY)}px`;
            }

            target.addEventListener('pointerdown', () => {
                score++;
                scoreEl.innerText = score;
                moveTarget();
            });

            startBtn.addEventListener('click', () => {
                score = 0; timeLeft = 10;
                scoreEl.innerText = score; timeEl.innerText = timeLeft;
                startBtn.style.display = 'none';
                target.style.display = 'block';
                moveTarget();

                gameInterval = setInterval(() => {
                    timeLeft--;
                    timeEl.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(gameInterval);
                        target.style.display = 'none';
                        startBtn.style.display = 'block';
                        startBtn.innerText = "Play Again";
                        window.showRewardedAd(); 
                    }
                }, 1000);
            });
        });
    </script>
</body>
</html>
