<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target Tapper</title>
    
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- TeleAds SDK -->
    <script src="https://assets.teleads.pro/sdk/index.umd.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #17212b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: absolute;
            top: 20px;
            display: flex;
            justify-content: space-between;
            width: 80%;
            font-size: 24px;
            font-weight: bold;
        }

        .game-area {
            position: relative;
            width: 90vw;
            height: 50vh;
            background-color: #232e3c;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .target {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #2ea6ff, #0078d7);
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #2ea6ff;
            transition: transform 0.1s ease;
        }

        .target:active {
            transform: scale(0.9);
        }

        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #2ea6ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 166, 255, 0.4);
        }

        .btn:active {
            background-color: #1c8ce6;
        }

        .hidden {
            display: none;
        }

        /* --- AD BANNER STYLES --- */
        .ad-wrapper {
            position: absolute;
            bottom: 15px;
            width: 90%;
            min-height: 80px;
            background-color: #232e3c;
            border: 1px dashed #4a5d70;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b9eb0;
            font-size: 14px;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#17212b');
        tg.setBackgroundColor('#17212b');
    </script>

    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">10</span>s</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="target hidden" id="target"></div>
    </div>

    <button class="btn" id="startBtn">Start Game</button>

    <div class="ad-wrapper" id="adsun-ad-container">
        <span id="adText" style="color: #8b9eb0;">Ad Space (Waiting...)</span>
    </div>

    <script>
        /* ==========================================
           GAME LOGIC
           ========================================== */
        const target = document.getElementById('target');
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const adTextEl = document.getElementById('adText');

        let score = 0;
        let timeLeft = 10;
        let gameInterval;
        let isPlaying = false;

        // ----- TeleAds SDK Configuration -----
        // Using the IDs from your screenshots
        const SDK_TOKEN = '58e2ce620..........................................................'; // 👈 REPLACE THIS WITH FULL TOKEN FROM DASHBOARD
        const AD_UNIT_ID_1 = '1310';
        const AD_UNIT_ID_2 = '1311';

        // Initialize TeleAds
        if (typeof TeleAdsTMA !== 'undefined') {
            TeleAdsTMA.init({
                token: SDK_TOKEN,
                debug: true,
                onInitiated: () => {
                    adTextEl.innerText = "TeleAds Ready";
                },
                onError: (error) => {
                    console.error("TeleAds Error:", error);
                    adTextEl.innerText = "Ad Error: " + (error.message || error);
                }
            });
        } else {
            adTextEl.innerText = "SDK Blocked / Not Loaded";
        }

        function showRewardedAd() {
            if (typeof TeleAdsTMA === 'undefined') return;
            
            adTextEl.innerText = "Loading Ad...";

            TeleAdsTMA.showAd({
                adUnitId: AD_UNIT_ID_1, // Using your "Gambling ads" ID
                onAdLoaded: () => {
                    adTextEl.innerText = "Ad Playing...";
                }
            })
            .then(() => {
                console.log('Ad completed! Reward user.');
                adTextEl.innerText = "Ad Completed! +2 Score";
                score += 2; // Reward the user
                scoreEl.innerText = score;
            })
            .catch((err) => {
                console.warn('Ad failed to display:', err);
                // Show the error on screen so you can see why it failed
                adTextEl.innerText = "Ad Failed: " + (err.message || "No fill");
            });
        }

        // ----- GAME FUNCTIONS -----
        function moveTarget() {
            const areaRect = gameArea.getBoundingClientRect();
            const targetSize = 80; 
            const maxX = areaRect.width - targetSize;
            const maxY = areaRect.height - targetSize;
            target.style.left = `${Math.floor(Math.random() * maxX)}px`;
            target.style.top = `${Math.floor(Math.random() * maxY)}px`;
        }

        function handleTargetClick() {
            if (!isPlaying) return;
            score++;
            scoreEl.innerText = score;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            moveTarget();
        }

        function startGame() {
            score = 0;
            timeLeft = 10;
            isPlaying = true;
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            
            startBtn.style.display = 'none';
            target.classList.remove('hidden');
            moveTarget();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            target.classList.add('hidden');
            startBtn.innerText = `Play Again (Score: ${score})`;
            startBtn.style.display = 'block';
            
            // Show Ad and Reward User after game ends
            showRewardedAd();
        }

        target.addEventListener('pointerdown', handleTargetClick);
        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
